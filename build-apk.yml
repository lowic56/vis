name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Creer le projet Android
        run: npx --yes cap add android

      - name: Icones (facultatif)
        run: npx --yes @capacitor/assets generate --android
        continue-on-error: true

      - name: Copier l'application dans le projet
        run: npx --yes cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: longueur-vis-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
