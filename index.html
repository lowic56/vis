<style>
*{box-sizing:border-box}
body{margin:0;background:#595959;color:#000;-webkit-text-size-adjust:100%;
 font-family:Calibri,Carlito,"Segoe UI",Roboto,Arial,sans-serif}
.feuille{background:#fff;margin:8px;padding:8px;border:2px solid #000;
 max-width:760px;margin-left:auto;margin-right:auto}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.btn{display:inline-block;padding:10px 12px;border:1px solid #000;
 background:#e7e6e6;color:#000;text-decoration:none;font-size:15px;
 border-radius:3px}
.btn.on{background:#bdd7ee;font-weight:bold}
h1{margin:0 0 10px;background:#d9d9d9;border:1px solid #999;text-align:center;
 font-size:20px;padding:12px 6px}
.titre{background:#d9d9d9;border:1px solid #000;text-align:center;
 font-weight:bold;font-size:13px;padding:3px;margin-bottom:-1px}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));
 margin:0 0 14px 1px}
.c{border:1px solid #000;margin:0 0 -1px -1px;min-width:0;display:flex;flex-direction:column}
.c .h{background:#d9d9d9;text-align:center;font-size:12px;padding:4px 2px;
 border-bottom:1px solid #000}
.c .v{flex:1;padding:4px;text-align:center;min-height:46px;display:flex;
 flex-direction:column;justify-content:center;gap:3px}
.jaune .v{background:#ff0}
.vert .v{background:#c6e0b4;font-size:24px;font-weight:bold}
.gros .v{font-size:20px}
select,input{font:inherit;font-size:16px;width:100%;max-width:100%;
 min-height:36px;border:0;background:transparent;text-align:center;
 text-align-last:center;font-weight:bold;color:#000}
.jaune input,.jaune select{border-bottom:1px dashed #777}
.res{display:grid;grid-template-columns:110px 1fr 1fr;margin:0 0 6px 1px}
.res4{grid-template-columns:110px 1fr 1fr 1fr}
@media(max-width:520px){.res,.res4{grid-template-columns:1fr 1fr}.res .c:first-child{grid-column:1/3}}
.m{font-size:14px;margin:2px 0}
.note{font-size:13px;color:#555;font-style:italic;margin:4px 0}
.err{background:#fde7e7;border:1px solid #c00;padding:8px;margin:8px 0;
 font-size:15px}
.dessin{border:2px solid #000;margin-top:10px;background:#fff}
.dessin svg{display:block;width:100%;height:auto}
details{margin-top:10px;font-size:14px}
table.det{border-collapse:collapse;margin-top:6px}
table.det td{border:1px solid #999;padding:3px 8px}
table.det td+td{text-align:right}
.warn{background:#fff4d6;border:1px solid #c90;padding:8px;margin:8px 0;
 font-size:15px}
.ext{stroke:#000;stroke-width:1}
.cot{stroke:#000;stroke-width:1.5}
.tx{fill:#000;font-family:Calibri,Carlito,Roboto,Arial,sans-serif;
 stroke:#fff;stroke-width:6px;paint-order:stroke;stroke-linejoin:round}
.rouge{fill:#c00;font-weight:bold}

.btn{cursor:pointer;font-family:inherit}
button.btn{line-height:1.2}
select{-webkit-appearance:menulist}
body{padding-bottom:env(safe-area-inset-bottom)}
</style></head>

// --------------------------------------------------------------------------
// DONNEES
// --------------------------------------------------------------------------
const ECROUS = ["Standard", "Bas", "à embase", "Nylstop"];
const RONDELLES = ["S", "M", "L", "LL"];
const MATIERES = { acier: "Acier / Inox", alu: "Alu" };
const IMPL_COEF = { acier: 1.0, alu: 1.5 };
const LG_TH = [6, 8, 10, 12, 16, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70, 80,
  90, 100, 110, 120, 130, 140, 150, 160, 180, 200];
const LG_CHC = [2.5, 3, 4, 5, 6, 8, 10, 12, 16, 20, 25, 30, 35, 40, 45, 50, 55, 60,
  65, 70, 80, 90, 100, 110, 120, 130, 140];
const LG_TF = [4, 6, 8, 10, 12, 16, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70, 80,
  90, 100, 120];
const LISTES = { TH: LG_TH, CHC: LG_CHC, TF: LG_TF };
const STD = "Standard (2 filets)";
const EPS = 1e-9;

class ErreurDonnee extends Error {}

const le = (a, b) => a <= b + EPS;
const ge = (a, b) => a >= b - EPS;
const lt = (a, b) => a < b - EPS;

// controle de la table au chargement
(function verifTable() {
  for (const d of DIAMS) {
    const t = TABLE[String(d)];
    for (const m of Object.keys(IMPL_COEF)) {
      if (Math.abs(t[m][0] - IMPL_COEF[m] * d) > 1e-6) throw new Error("Table M" + d + " " + m);
      if (d >= 6 && Math.abs(t[m][1] - t[m][0] - 4 * t.pas) > 1e-6) throw new Error("Prof M" + d + " " + m);
    }
  }
})();

// --------------------------------------------------------------------------
// OUTILS
// --------------------------------------------------------------------------
function gstr(v) {                       // equivalent de "{:g}" (6 chiffres)
  if (v === 0) return "0";
  return String(Number(Number(v).toPrecision(6)));
}
function fmt(x) {
  if (x === null || x === undefined) return "-";
  return gstr(Number(Number(x).toFixed(3)));
}
function donnee(valeur, libelle, d) {
  if (valeur === null || valeur === undefined)
    throw new ErreurDonnee(libelle + " : non disponible pour M" + fmt(d));
  return valeur;
}
function diam(d) {
  d = Number(d);
  for (const k of DIAMS) if (Math.abs(k - d) < 1e-9) return k;
  throw new ErreurDonnee("Diamètre M" + fmt(d) + " absent du tableau");
}
function forcageRondelleTete(tete, rondelle) {
  rondelle = rondelle || "-";
  if (rondelle === "Cuvette" && tete !== "TF")
    return ["M", "Cuvette réservée aux vis TF : rondelle forcée à M."];
  if (tete === "TF" && rondelle !== "Cuvette" && rondelle !== "-")
    return ["Cuvette", "Vis TF : rondelle forcée à Cuvette."];
  return [rondelle, null];
}
function rondelle(d, code) {
  if (code === "-" || code === "" || code === "Cuvette") return 0.0;
  if (!RONDELLES.includes(code)) throw new ErreurDonnee("Rondelle inconnue : " + code);
  return donnee(TABLE[String(d)].rond[code], "Rondelle " + code, d);
}
function ecrou(d, type, autorises) {
  if (type === "-" || type === "" || type === null || type === undefined) return 0.0;
  if (!autorises.includes(type)) throw new ErreurDonnee("Type d'écrou non permis ici : " + type);
  return donnee(TABLE[String(d)].ecrou[ECROUS.indexOf(type)], "Écrou " + type, d);
}
function libre(d, valeur) {
  if (typeof valeur === "string" && valeur.startsWith("Standard"))
    return 2.0 * TABLE[String(d)].pas;
  return Number(valeur);
}

// --------------------------------------------------------------------------
// VIS (feuille « Vis »)
// --------------------------------------------------------------------------
function lgEcrou(mini, liste) {
  for (const L of liste) if (le(mini, L)) return L;
  return null;                                   // « Non standard »
}
/* Trou taraude : mini = base + implantation mini ; maxi = base + profondeur de
   taraudage. On retient la plus longue longueur standard dans [mini ; maxi]. */
function lgTrou(liste, base, impl, prof) {
  const mini = base + impl, maxi = base + prof;
  const ok = liste.filter(L => ge(L, mini) && le(L, maxi));
  if (ok.length) return [Math.max(...ok), "ok", mini, maxi];
  return [null, "non", mini, maxi];
}

function calculVis(d, tete = "TH", rondTete = "M", epaisseur = 20.0, montage = "ecrou",
                   rondEcrou = "M", ecrouT = "Standard", contreEcrou = "-",
                   libreV = STD, matiere = "acier") {
  d = diam(d);
  const t = TABLE[String(d)];
  const notes = [];
  const [rt, msg] = forcageRondelleTete(tete, rondTete);
  rondTete = rt;
  if (msg) notes.push(msg);
  if (!(tete in LISTES)) throw new ErreurDonnee("Tête inconnue : " + tete);
  const C = donnee({ TH: t.h_th, CHC: t.h_chc, TF: t.h_tf }[tete], "Hauteur de tête " + tete, d);
  const E = rondelle(d, rondTete);
  const G = Number(epaisseur);
  const liste = LISTES[tete];
  const tf = tete === "TF";
  const res = { d, tete, montage, notes, lignes: [], C, E, G, rond_tete: rondTete };
  if (tete === "CHC") res.cote_tete = rondTete === "-" ? C : C + E;
  else if (rondTete === "-") res.cote_tete = tf ? null : C;
  else res.cote_tete = C + E;

  if (montage === "ecrou") {
    const K = rondelle(d, rondEcrou);
    const M = ecrou(d, ecrouT, ECROUS);
    const P = ecrou(d, contreEcrou, ["Standard", "Bas"]);
    const S = libre(d, libreV);
    const mini = ((tf && rondTete !== "-") ? C : 0.0) + E + G + K + M + P + S;
    const retenue = lgEcrou(mini, liste);
    Object.assign(res, { K, M, P, S, mini, retenue, rond_ecrou: rondEcrou,
      ecrou_t: ecrouT, contre_t: contreEcrou, titre_calc: "Longueur minimale calculée" });
    if (tf && rondTete !== "-") res.lignes.push(["Tête TF + cuvette", C]);
    res.lignes.push(
      ["Rondelle tête (" + rondTete + ")", E],
      ["Épaisseur à serrer", G],
      ["Rondelle écrou (" + rondEcrou + ")", K],
      ["Écrou " + (ecrouT || "-"), M],
      ["Contre-écrou " + (contreEcrou || "-"), P],
      ["Longueur libre", S]);
    if (retenue !== null) {
      res.depassement = retenue - E - G;
      res.apres_ecrou = retenue - E - G - K - M;
      if (P) res.apres_contre_ecrou = res.apres_ecrou - P;
    }
  } else if (montage === "trou") {
    if (!(matiere in MATIERES)) throw new ErreurDonnee("Matière inconnue : " + matiere);
    const impl = IMPL_COEF[matiere] * d;
    const prof = donnee(t[matiere][1], "Profondeur de taraudage (" + MATIERES[matiere] + ")", d);
    const teteH = (tf && rondTete !== "-") ? C : 0.0;
    const base = teteH + E + G;
    const [retenue, statut, mini, maxi] = lgTrou(liste, base, impl, prof);
    Object.assign(res, { matiere, impl_mini: impl, prof_taraudage: prof, base, mini, maxi,
      retenue, statut, titre_calc: "Longueur maximale calculée" });
    res.lignes = [];
    if (teteH) res.lignes.push(["Tête TF + cuvette", teteH]);
    res.lignes.push(
      ["Rondelle tête (" + rondTete + ")", E],
      ["Épaisseur à serrer", G],
      ["Implantation mini (" + fmt(IMPL_COEF[matiere]) + " x Ø)", impl],
      ["Profondeur taraudage", prof]);
    if (retenue !== null) {
      res.implantation = retenue - base;
      if (!ge(res.implantation, impl) || !le(res.implantation, prof))
        throw new ErreurDonnee("Controle implantation en échec (M" + fmt(d) + " " + matiere + ")");
    }
  } else {
    throw new ErreurDonnee("Montage inconnu : " + montage);
  }
  return res;
}

function msgTrou(r) {
  if (r.statut === "non")
    return "Aucune longueur standard entre " + fmt(r.mini) + " et " + fmt(r.maxi) +
      " mm (implantation de " + fmt(r.impl_mini) + " mm à " + fmt(r.prof_taraudage) +
      " mm) : modifier l'épaisseur, la rondelle ou le type de vis.";
  return null;
}

// --------------------------------------------------------------------------
// BRIDAGE (feuille « Bridage »)
// --------------------------------------------------------------------------
function calculBridage(d, libreG = 10, contreG = "-", ecrouG = "Standard", rondG = "M",
                       epaisseur = 21.0, rondD = "M", ecrouD = "Standard", contreD = "-",
                       libreD = 10) {
  d = diam(d);
  const cg = ecrou(d, contreG, ["Standard", "Bas"]);
  const eg = ecrou(d, ecrouG, ECROUS);
  const rg = rondelle(d, rondG);
  const rd = rondelle(d, rondD);
  const ed = ecrou(d, ecrouD, ECROUS);
  const cd = ecrou(d, contreD, ["Standard", "Bas"]);
  const lg_ = libre(d, libreG), ld_ = libre(d, libreD);
  const G = Number(epaisseur);
  const lignes = [
    ["Libre gauche", lg_], ["Contre-écrou G", cg], ["Écrou G", eg],
    ["Rondelle G (" + rondG + ")", rg], ["Épaisseur à serrer", G],
    ["Rondelle D (" + rondD + ")", rd], ["Écrou D", ed],
    ["Contre-écrou D", cd], ["Libre droite", ld_]];
  const mini = lg_ + cg + eg + rg + G + rd + ed + cd + ld_;
  const retenue = Math.ceil(Number((mini / 5.0).toFixed(9))) * 5;
  const pile = cg + eg + rg + G + rd + ed + cd;
  return { d, lignes, mini, retenue, cote_demi: (retenue - G) / 2.0,
           libre_centre: (retenue - pile) / 2.0 };
}

const FS_VIS = 22, FS_BRI = 27;
const g = v => gstr(v);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#x27;");
const IMG_URL = {};
if (typeof IMG !== "undefined") for (const k of Object.keys(IMG)) IMG_URL[k] = "data:image/png;base64," + IMG[k];

function svgImg(nom, x, y, w, h, miroir = false) {
  const t = miroir ? ' transform="translate(' + g(2 * x + w) + ',0) scale(-1,1)"' : "";
  return '<image href="' + (IMG_URL[nom] || "/img/" + nom + ".png") + '" x="' + g(x) + '" y="' + g(y) +
    '" width="' + g(w) + '" height="' + g(h) + '" preserveAspectRatio="none"' + t + "/>";
}
function svgTexte(x, y, s, ancre = "middle", cls = "tx", taille = FS_VIS) {
  return '<text x="' + g(x) + '" y="' + g(y) + '" text-anchor="' + ancre + '" class="' + cls +
    '" font-size="' + taille + '">' + esc(s) + "</text>";
}
function svgCote(x1, x2, y, texte, yBas, taille = FS_VIS) {
  if (x2 - x1 < 2 || texte === null || texte === "") return "";
  let s = '<line x1="' + g(x1) + '" y1="' + g(y - 12) + '" x2="' + g(x1) + '" y2="' + g(yBas) + '" class="ext"/>' +
    '<line x1="' + g(x2) + '" y1="' + g(y - 12) + '" x2="' + g(x2) + '" y2="' + g(yBas) + '" class="ext"/>';
  s += '<line x1="' + g(x1) + '" y1="' + g(y) + '" x2="' + g(x2) + '" y2="' + g(y) +
    '" class="cot" marker-start="url(#fl)" marker-end="url(#fl)"/>';
  return s + svgTexte((x1 + x2) / 2.0, y - 8, texte, "middle", "tx", taille);
}
function svgCadre(corps, xmin, ymin, xmax, ymax) {
  return '<svg viewBox="' + g(xmin) + " " + g(ymin) + " " + g(xmax - xmin) + " " + g(ymax - ymin) +
    '" xmlns="http://www.w3.org/2000/svg" role="img"><defs>' +
    '<marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">' +
    '<path d="M0,1.5 L10,5 L0,8.5 z" fill="#000"/></marker></defs>' +
    '<rect x="' + g(xmin) + '" y="' + g(ymin) + '" width="' + g(xmax - xmin) + '" height="' + g(ymax - ymin) +
    '" fill="#fff"/>' + corps + "</svg>";
}
function pileGeo(x0, ec, contre) {
  const out = []; let xFin = x0, grand = false;
  if (ec !== "-" && ec !== "" && ec !== null && ec !== undefined) {
    const [nom, w, dx] = ECROU_IMG[ec];
    const x = x0 + dx;
    out.push([nom, x, w]); xFin = x + w;
    grand = ec === "à embase" || ec === "Nylstop";
  }
  if (contre !== "-" && contre !== "" && contre !== null && contre !== undefined) {
    let nom, w;
    if (contre === "Standard") { nom = "ECROU"; w = grand ? 88 : 83; }
    else { nom = "ECROU_B"; w = grand ? 54 : 49; }
    const x = xFin > x0 ? xFin - 1 : x0;
    out.push([nom, x, w]); xFin = x + w;
  }
  return [out, xFin];
}
function pileDroite(x0, ec, contre) {
  const [geo, xFin] = pileGeo(x0, ec, contre);
  return [geo.map(([n, x, w]) => svgImg(n, x, Y_VIS, w, H_VIS)), xFin];
}
function pileMiroir(axe, x0, ec, contre) {
  const [geo, xFin] = pileGeo(x0, ec, contre);
  return [geo.map(([n, x, w]) => svgImg(n, 2 * axe - (x + w), Y_VIS, w, H_VIS, true)), 2 * axe - xFin];
}

function svgVis(r) {
  const trou = r.montage === "trou";
  const tete = r.tete, rond = r.rond_tete;
  const imgVis = VIS_IMG[tete];
  const corps = [svgImg(...imgVis)];
  let xE, xCoteTete;
  if (tete === "TF") {
    xE = rond === "Cuvette" ? 197 : 145;
    xCoteTete = 143;
  } else {
    if (rond !== "-" && rond !== "") {
      corps.push(svgImg("RDL", X_RDL1, Y_VIS, W_RDL, H_VIS));
      xE = X_RDL1 + W_RDL;
    } else xE = X_RDL1;
    xCoteTete = imgVis[1];
  }
  const surcouche = (tete === "TF" && rond === "Cuvette") ? [svgImg("TFRDL", 142, 450, 55, 231)] : [];
  const cotes = [];
  if (r.cote_tete !== null) cotes.push(svgCote(xCoteTete, xE, Y_C1, fmt(r.cote_tete), 526));
  if (trou) {
    corps.push(svgImg("TROU", X_TROU, Y_TROU, W_TROU, H_TROU), ...surcouche);
    cotes.push(svgCote(xE, X_TROU, Y_C1, "Epaisseur = " + fmt(r.G), 526));
    const prof = r.prof_taraudage, impl = r.impl_mini;
    if (r.implantation !== undefined)
      cotes.push(svgCote(X_TROU, X_FIN, Y_C1, "Implantation = " + fmt(r.implantation), 526));
    const xMini = X_TROU + (X_TROU_FOND - X_TROU) * Math.min(1.0, impl / prof);
    cotes.push(svgCote(X_TROU, xMini, Y_C15, "Implantation mini = " + fmt(impl), 526));
    cotes.push(svgCote(X_TROU, X_TROU_FOND, Y_C0, "Profondeur taraudage = " + fmt(prof), 526));
    if (r.retenue === null)
      cotes.push(svgTexte(X_FIN + 100, Y_C1 - 40, "Longueur non standard", "end", "tx rouge"));
    return svgCadre(corps.concat(cotes).join(""), 60, 305, 800, 690);
  }
  const xP = r.K > 0 ? X_RDL2 : X_PILE;
  if (r.K > 0) corps.push(svgImg("RDL", X_RDL2, Y_VIS, W_RDL, H_VIS));
  const [pile, xFin] = pileDroite(X_PILE, r.ecrou_t, r.contre_t);
  corps.push(...pile, ...surcouche);
  cotes.push(svgCote(xE, xP, Y_C1, "Epaisseur = " + fmt(r.G), 526));
  if (r.retenue === null) {
    cotes.push(svgTexte(X_FIN + 20, Y_C1 - 40, "Longueur non standard", "end", "tx rouge"));
  } else {
    cotes.push(svgCote(xP, X_FIN, Y_C1, fmt(r.depassement), 526));
    const reste = r.apres_contre_ecrou !== undefined ? r.apres_contre_ecrou : r.apres_ecrou;
    if (xFin < X_FIN - 4) cotes.push(svgCote(xFin - 2, X_FIN, Y_C2, fmt(reste), 561));
  }
  return svgCadre(corps.concat(cotes).join(""), 60, 395, 700, 690);
}

function svgBridage(r, e) {
  const rg = r.lignes[3][1], rd = r.lignes[5][1], G = r.lignes[4][1];
  const X0 = 158, X1 = 1129;
  const axe = (X0 + X1) / 2.0, demi = 79.5;
  const xd = axe + demi, xg = axe - demi - W_RDL, xPile = xd + W_RDL - 1;
  const corps = [svgImg("TIGE", X0, 523, X1 - X0, 87)];
  const [pg, xG0] = pileMiroir(axe, xPile, r.lignes[2][1] > 0 ? e.eg : "-", r.lignes[1][1] > 0 ? e.cg : "-");
  const [pd, xD1] = pileDroite(xPile, r.lignes[6][1] > 0 ? e.ed : "-", r.lignes[7][1] > 0 ? e.cd : "-");
  corps.push(...pg, ...pd);
  const xP0 = rg > 0 ? xg + W_RDL : xg;
  const xP1 = rd > 0 ? xd : xd + W_RDL;
  if (rg > 0) corps.push(svgImg("RDL", xg, Y_VIS + 1, W_RDL, H_VIS));
  if (rd > 0) corps.push(svgImg("RDL", xd, Y_VIS + 1, W_RDL, H_VIS));
  const f = FS_BRI;
  const cotes = [
    svgCote(X0, xP0, Y_C1, fmt(r.cote_demi), 526, f),
    svgCote(xP0, xP1, Y_C1, "Epaisseur = " + fmt(G), 526, f),
    svgCote(xP1, X1, Y_C1, fmt(r.cote_demi), 526, f),
    svgCote(X0, xG0 + 2, Y_C2, fmt(r.libre_centre), 561, f),
    svgCote(xD1 - 2, X1, Y_C2, fmt(r.libre_centre), 561, f)];
  return svgCadre(corps.concat(cotes).join(""), 140, 395, 1148, 690);
}

// --------------------------------------------------------------------------
// INTERFACE
// --------------------------------------------------------------------------
const DEF_VIS = { mo: "ecrou", d: "6", t: "TH", rt: "M", ep: "20", re: "M", ec: "Standard",
                  ce: "-", li: "std", liv: "0", mat: "acier" };
const DEF_BRI = { d: "6", lg: "perso", lgv: "10", cg: "-", eg: "Standard", rg: "M", ep: "21",
                  rd: "M", ed: "Standard", cd: "-", ld: "perso", ldv: "10" };
const ETAT = { page: "vis", v: Object.assign({}, DEF_VIS), b: Object.assign({}, DEF_BRI), det: false };
let CUR = "v";

function num(s, lib) {
  const t = String(s).trim().replace(/,/g, ".");
  if (!/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(t))
    throw new ErreurDonnee(lib + " : valeur numérique invalide (" + s + ")");
  const v = Number(t);
  if (v < 0 || !isFinite(v)) throw new ErreurDonnee(lib + " : valeur négative ou invalide");
  return v;
}
function selH(name, options, valeur, labels) {
  const o = options.map(v => '<option value="' + esc(v) + '"' + (String(v) === String(valeur) ? " selected" : "") +
    ">" + esc((labels && labels[v] !== undefined) ? labels[v] : v) + "</option>").join("");
  return '<select name="' + name + '" data-s="' + CUR + '">' + o + "</select>";
}
function champH(name, valeur) {
  return '<input name="' + name + '" data-s="' + CUR + '" value="' + esc(valeur) + '" inputmode="decimal">';
}
function caseH(titre, contenu, cls = "jaune") {
  return '<div class="c ' + cls + '"><div class="h">' + titre + '</div><div class="v">' + contenu + "</div></div>";
}
function libreCellule(titre, nom, e) {
  let c = selH(nom, ["std", "perso"], e[nom], { std: "Std (2 filets)", perso: "Valeur (mm)" });
  if (e[nom] === "perso") c += champH(nom + "v", e[nom + "v"]);
  return caseH(titre, c);
}
function btn(txt, act, actif) {
  return '<button type="button" class="btn' + (actif ? " on" : "") + '" data-act="' + act + '">' + txt + "</button>";
}
function detailH(r) {
  const l = r.lignes.map(([a, v]) => "<tr><td>" + esc(a) + "</td><td>" + fmt(v) + "</td></tr>").join("");
  return '<details id="det"' + (ETAT.det ? " open" : "") + '><summary>Détail du calcul</summary><table class="det">' + l + "</table></details>";
}
const dLabels = {}; DIAMS.forEach(k => { dLabels[k] = "M " + fmt(k); });

function pageVis() {
  CUR = "v";
  const e = ETAT.v;
  if (!(e.mat in MATIERES)) e.mat = "acier";
  if (e.mo !== "ecrou" && e.mo !== "trou") e.mo = "ecrou";
  let r = null, erreur = null; const notes = [];
  try {
    const d = diam(num(e.d, "Diamètre"));
    const [rt, msg] = forcageRondelleTete(e.t, e.rt);
    e.rt = rt;
    if (msg) notes.push(msg);
    const lib = e.li === "std" ? STD : num(e.liv, "Longueur libre");
    r = calculVis(d, e.t, e.rt, num(e.ep, "Épaisseur"), e.mo, e.re, e.ec, e.ce, lib, e.mat);
    notes.push(...r.notes);
  } catch (ex) { if (ex instanceof ErreurDonnee) erreur = ex.message; else throw ex; }
  const trou = e.mo === "trou";
  let nav = btn("Vis", "page:vis", true) + btn("Bridage", "page:bridage", false);
  nav += btn("Montage STD (écrou)", "mo:ecrou", !trou) + btn("Trou taraudé", "mo:trou", trou);
  if (trou) nav += btn("Acier / Inox (1×Ø)", "mat:acier", e.mat === "acier") + btn("Alu (1,5×Ø)", "mat:alu", e.mat === "alu");
  const rondelles = e.t === "TF" ? ["Cuvette", "-"] : ["S", "M", "L", "LL", "-"];
  const cases = [caseH("Tête", selH("t", ["TH", "CHC", "TF"], e.t)),
    caseH("Rondelle", selH("rt", rondelles, e.rt)),
    caseH("Epaisseur à serrer", champH("ep", e.ep))];
  if (!trou) cases.push(
    caseH("Rondelle", selH("re", ["S", "M", "L", "LL", "-"], e.re)),
    caseH("écrou", selH("ec", ECROUS, e.ec)),
    caseH("contre-écrou", selH("ce", ["-", "Standard", "Bas"], e.ce)),
    libreCellule("longueur libre", "li", e));
  let c = '<div class="nav">' + nav + '</div><h1>Calcul de longueur de vis</h1>';
  c += '<div class="titre">Type de montage</div><div class="grille">' + cases.join("") + "</div>";
  const dSel = selH("d", DIAMS, e.d, dLabels);
  let val = "-", calc = "-", titreCalc = "Longueur minimale calculée";
  if (r) {
    val = r.retenue === null ? "Non standard" : fmt(r.retenue);
    calc = fmt(trou ? r.maxi : r.mini);
    titreCalc = r.titre_calc;
  }
  if (trou) {
    c += '<div class="res res4">' + caseH("Ø vis", dSel) + caseH("Longueur de vis à utiliser", esc(val), "vert") +
      caseH("Longueur minimale théorique", esc(r ? fmt(r.mini) : "-"), "gros") + caseH(titreCalc, esc(calc), "gros") + "</div>";
  } else {
    c += '<div class="res">' + caseH("Ø vis", dSel) + caseH("Longueur de vis à utiliser", esc(val), "vert") +
      caseH(titreCalc, esc(calc), "gros") + "</div>";
  }
  for (const n of notes) c += '<div class="note">' + esc(n) + "</div>";
  if (erreur) c += '<div class="err">' + esc(erreur) + "</div>";
  if (r) {
    if (trou) {
      c += '<div class="m">Profondeur taraudage = ' + fmt(r.prof_taraudage) + "</div>" +
        '<div class="m">Implantation mini (' + fmt(IMPL_COEF[e.mat]) + "×Ø " + esc(MATIERES[e.mat]) + ") = " + fmt(r.impl_mini) + "</div>";
      if (r.implantation !== undefined) c += '<div class="m">Implantation = ' + fmt(r.implantation) + "</div>";
      const m = msgTrou(r);
      if (m) c += '<div class="warn">' + esc(m) + "</div>";
    }
    c += '<div class="dessin">' + svgVis(r) + "</div>" + detailH(r);
  }
  return c;
}

function pageBridage() {
  CUR = "b";
  const e = ETAT.b;
  let r = null, erreur = null;
  try {
    const d = diam(num(e.d, "Diamètre"));
    const lg = e.lg === "std" ? STD : num(e.lgv, "Longueur libre gauche");
    const ld = e.ld === "std" ? STD : num(e.ldv, "Longueur libre droite");
    r = calculBridage(d, lg, e.cg, e.eg, e.rg, num(e.ep, "Épaisseur"), e.rd, e.ed, e.cd, ld);
  } catch (ex) { if (ex instanceof ErreurDonnee) erreur = ex.message; else throw ex; }
  const nav = btn("Vis", "page:vis", false) + btn("Bridage", "page:bridage", true);
  const rond = ["S", "M", "L", "LL", "Cuvette", "-"];
  const cases = [libreCellule("Longueur libre", "lg", e),
    caseH("Contre-écrou", selH("cg", ["-", "Standard", "Bas"], e.cg)),
    caseH("écrou", selH("eg", ECROUS, e.eg)),
    caseH("Rondelle", selH("rg", rond, e.rg)),
    caseH("Epaisseur à serrer", champH("ep", e.ep)),
    caseH("Rondelle", selH("rd", rond, e.rd)),
    caseH("écrou", selH("ed", ECROUS, e.ed)),
    caseH("Contre-écrou", selH("cd", ["-", "Standard", "Bas"], e.cd)),
    libreCellule("longueur libre", "ld", e)];
  let c = '<div class="nav">' + nav + "</div><h1>Calcul de longueur de tige filetée lors d'un bridage</h1>";
  c += '<div class="titre">Type de montage</div><div class="grille">' + cases.join("") + "</div>";
  const dSel = selH("d", DIAMS, e.d, dLabels);
  c += '<div class="res">' + caseH("Ø", dSel) +
    caseH("Longueur de tige à utiliser", esc(r ? fmt(r.retenue) : "-"), "vert") +
    caseH("Longueur minimale calculée", esc(r ? fmt(r.mini) : "-"), "gros") + "</div>";
  if (erreur) c += '<div class="err">' + esc(erreur) + "</div>";
  if (r) c += '<div class="dessin">' + svgBridage(r, e) + "</div>" + detailH(r);
  return c;
}

function sauver() {
  try { localStorage.setItem("clv_etat", JSON.stringify({ page: ETAT.page, v: ETAT.v, b: ETAT.b })); } catch (_) {}
}
function charger() {
  try {
    const s = JSON.parse(localStorage.getItem("clv_etat") || "null");
    if (!s) return;
    if (s.page === "vis" || s.page === "bridage") ETAT.page = s.page;
    for (const k of Object.keys(DEF_VIS)) if (s.v && typeof s.v[k] === "string") ETAT.v[k] = s.v[k];
    for (const k of Object.keys(DEF_BRI)) if (s.b && typeof s.b[k] === "string") ETAT.b[k] = s.b[k];
  } catch (_) {}
}
function render() {
  const app = document.getElementById("app");
  app.innerHTML = ETAT.page === "bridage" ? pageBridage() : pageVis();
  sauver();
}

if (typeof document !== "undefined") {
  charger();
  document.addEventListener("DOMContentLoaded", () => {
    render();
    const app = document.getElementById("app");
    app.addEventListener("change", ev => {
      const t = ev.target;
      if (!t.name || !t.dataset.s) return;
      const def = t.dataset.s === "v" ? DEF_VIS : DEF_BRI;
      const v = t.value.trim();
      ETAT[t.dataset.s][t.name] = v === "" ? def[t.name] : v;
      render();
    });
    app.addEventListener("click", ev => {
      const b = ev.target.closest("button[data-act]");
      if (!b) return;
      const [k, v] = b.dataset.act.split(":");
      if (k === "page") ETAT.page = v;
      else ETAT.v[k] = v;
      render();
      window.scrollTo(0, 0);
    });
    app.addEventListener("toggle", ev => { if (ev.target.id === "det") { ETAT.det = ev.target.open; } }, true);
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      /* pas de service worker : les fichiers sont dans l'APK */
    }
  });
}
if (typeof module !== "undefined") {
  module.exports = { calculVis, calculBridage, svgVis, svgBridage, fmt, ErreurDonnee, DIAMS, TABLE, LISTES, ECROUS,
    forcageRondelleTete, libre, STD };
}

</script></body></html>
